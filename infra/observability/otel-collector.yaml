receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  transform/allowlist:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "deployment.environment.name"])
      - context: span
        statements:
          - keep_keys(attributes, ["error.type", "http.request.method", "http.response.status_code", "server.address", "url.path", "violet.request_id"])
    metric_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "deployment.environment.name"])
      - context: datapoint
        statements:
          - keep_keys(attributes, ["error.type", "http.request.method", "http.response.status_code", "model.name", "operation.name", "status", "url.path"])
    log_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "deployment.environment.name"])
      - context: log
        statements:
          - set(body, attributes["event.name"])
          - keep_keys(attributes, ["error.type", "event.name", "http.request.method", "http.response.status_code", "operation.name", "status", "url.path", "violet.request_id"])

exporters:
  otlphttp/lgtm:
    endpoint: http://lgtm:4318
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/allowlist, batch]
      exporters: [otlphttp/lgtm]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, transform/allowlist, batch]
      exporters: [otlphttp/lgtm]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/allowlist, batch]
      exporters: [otlphttp/lgtm]
