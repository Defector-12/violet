openapi: 3.1.1
info:
  title: Violet Core API
  version: 0.1.0
  description: Versioned control-plane API for the single-user Violet instance.
servers:
  - url: http://127.0.0.1:4310
paths:
  /v1/memory-settings:
    get:
      operationId: getMemorySettings
      summary: Read automatic learning state and the current memory revision.
      security:
        - deviceToken: []
      responses:
        "200":
          description: Authoritative settings; contains no memory content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemorySettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: updateMemorySettings
      summary: Change automatic learning with version and request identity checks.
      description: Disabling invalidates queued and running tasks. Enabling does not backfill history. A replay returns current settings without undoing newer changes.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemorySettingsUpdate"
      responses:
        "200":
          description: Current authoritative settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemorySettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/MemoryConflict"
  /v1/memories:
    get:
      operationId: listMemories
      summary: List current memories with sensitive content masked.
      security:
        - deviceToken: []
      responses:
        "200":
          description: Current memory snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/memories/{memoryId}:
    get:
      operationId: getMemory
      summary: Read memory versions and source turns.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/MemoryId"
        - in: query
          name: reveal
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Versions and source turns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/MemoryNotFound"
  /v1/memories/{memoryId}/corrections:
    post:
      operationId: correctMemory
      summary: Append an explicit correction and invalidate the prior version.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/MemoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryCorrection"
      responses:
        "200":
          description: Committed memory changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryMutation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/MemoryConflict"
  /v1/memory-deletions/previews:
    post:
      operationId: previewMemoryDeletion
      summary: Preview all affected source turns and memories without deleting them.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryDeletionPreviewRequest"
      responses:
        "200":
          description: Version-bound impact preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryDeletionPreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/MemoryConflict"
  /v1/memory-deletions/{deletionId}/preview:
    get:
      operationId: getMemoryDeletionPreview
      summary: Read a deletion preview proposed during conversation.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/DeletionId"
      responses:
        "200":
          description: Version-bound impact preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryDeletionPreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/MemoryNotFound"
  /v1/memory-deletions/{deletionId}/confirm:
    post:
      operationId: confirmMemoryDeletion
      summary: Confirm a preview after the Mac durably advances its minimum restore epoch.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/DeletionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryDeletionConfirmation"
      responses:
        "200":
          description: Online deletion committed; backup cleanup status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryDeletionStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/MemoryConflict"
  /v1/memory-deletions/{deletionId}:
    get:
      operationId: getMemoryDeletionStatus
      summary: Read backup cleanup status without exposing deleted content.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/DeletionId"
      responses:
        "200":
          description: Current deletion and cleanup status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryDeletionStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/MemoryNotFound"
  /v1/memory-deletions/{deletionId}/retry:
    post:
      operationId: retryMemoryBackupCleanup
      summary: Retry failed backup cleanup without undoing online deletion.
      security:
        - deviceToken: []
      parameters:
        - $ref: "#/components/parameters/DeletionId"
      responses:
        "200":
          description: Current cleanup status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryDeletionStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/MemoryNotFound"
  /v1/health/live:
    get:
      operationId: getLiveHealth
      summary: Report process liveness without reading personal content.
      responses:
        "200":
          description: Core process is alive.
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/health.schema.json
  /v1/status:
    get:
      operationId: getCoreStatus
      summary: Report whether Core is sealed or ready.
      security:
        - deviceToken: []
      responses:
        "200":
          description: Current Core status.
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/status.schema.json
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/context/envelopes:
    post:
      operationId: submitContextEnvelope
      summary: Validate and resolve one explicitly authorized context envelope.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/context-envelope.schema.json
      responses:
        "200":
          description: The context is available to the active conversation.
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/context-receipt.schema.json
        "400":
          description: The context envelope is invalid or violates local-policy assertions.
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          description: The context envelope has expired.
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json
        "423":
          description: Core is sealed.
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json
  /v1/context/sessions/{sessionId}:
    delete:
      operationId: deleteContextSession
      summary: End a context session and discard all ephemeral evidence.
      security:
        - deviceToken: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The context session was removed or had already expired.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          description: Core is sealed.
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json
  /v1/chat/stream:
    post:
      operationId: streamChat
      summary: Stream one text interaction as newline-delimited protocol events.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/chat-request.schema.json
      responses:
        "200":
          description: Newline-delimited ChatStreamEvent values.
          content:
            application/x-ndjson:
              schema:
                type: string
              x-ndjson-schema:
                $ref: ../schemas/v1/chat-stream-event.schema.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          description: Core is sealed.
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json
  /v1/realtime:
    get:
      operationId: connectRealtimeSession
      summary: Upgrade to a provider-neutral bidirectional realtime session.
      security:
        - deviceToken: []
      responses:
        "101":
          description: WebSocket protocol upgrade accepted.
          x-websocket-client-event:
            $ref: ../schemas/v1/realtime-client-event.schema.json
          x-websocket-server-event:
            $ref: ../schemas/v1/realtime-server-event.schema.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "423":
          description: Core is sealed.
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json
components:
  parameters:
    MemoryId:
      in: path
      name: memoryId
      required: true
      schema:
        type: string
        format: uuid
    DeletionId:
      in: path
      name: deletionId
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    MemorySettings:
      $ref: ../schemas/v1/memory.schema.json#/$defs/settings
    MemorySettingsUpdate:
      $ref: ../schemas/v1/memory.schema.json#/$defs/settingsUpdate
    Memory:
      $ref: ../schemas/v1/memory.schema.json#/$defs/memory
    MemoryChange:
      $ref: ../schemas/v1/memory.schema.json#/$defs/change
    MemoryList:
      $ref: ../schemas/v1/memory.schema.json#/$defs/list
    MemoryDetail:
      $ref: ../schemas/v1/memory.schema.json#/$defs/detail
    MemoryCorrection:
      $ref: ../schemas/v1/memory.schema.json#/$defs/correction
    MemoryMutation:
      $ref: ../schemas/v1/memory.schema.json#/$defs/mutation
    MemoryDeletionPreviewRequest:
      $ref: ../schemas/v1/memory.schema.json#/$defs/previewRequest
    MemoryDeletionPreview:
      $ref: ../schemas/v1/memory.schema.json#/$defs/preview
    MemoryDeletionConfirmation:
      $ref: ../schemas/v1/memory.schema.json#/$defs/confirmation
    MemoryDeletionStatus:
      $ref: ../schemas/v1/memory.schema.json#/$defs/deletionStatus
    ChatStreamEvent:
      $ref: ../schemas/v1/chat-stream-event.schema.json
    ContextEnvelope:
      $ref: ../schemas/v1/context-envelope.schema.json
    ContextReceipt:
      $ref: ../schemas/v1/context-receipt.schema.json
    RealtimeClientEvent:
      $ref: ../schemas/v1/realtime-client-event.schema.json
    RealtimeServerEvent:
      $ref: ../schemas/v1/realtime-server-event.schema.json
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque-device-token
  responses:
    MemoryConflict:
      description: Memory or deletion impact changed; refresh before retrying.
      content:
        application/json:
          schema:
            $ref: ../schemas/v1/error.schema.json
    MemoryNotFound:
      description: The memory or deletion no longer exists.
      content:
        application/json:
          schema:
            $ref: ../schemas/v1/error.schema.json
    Unauthorized:
      description: Device token is missing or invalid.
      content:
        application/json:
          schema:
            $ref: ../schemas/v1/error.schema.json
