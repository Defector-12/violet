openapi: 3.1.1
info:
  title: Violet Core API
  version: 0.1.0
  description: Versioned control-plane API for the single-user Violet instance.
servers:
  - url: http://127.0.0.1:4310
paths:
  /v1/health/live:
    get:
      operationId: getLiveHealth
      summary: Report process liveness without reading personal content.
      responses:
        '200':
          description: Core process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/health.schema'
  /v1/status:
    get:
      operationId: getCoreStatus
      summary: Report whether Core is sealed or ready.
      security:
        - deviceToken: []
      responses:
        '200':
          description: Current Core status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/status.schema'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/context/envelopes:
    post:
      operationId: submitContextEnvelope
      summary: Validate and resolve one explicitly authorized context envelope.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/context-envelope.schema'
      responses:
        '200':
          description: The context is available to the active conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/context-receipt.schema'
        '400':
          description: The context envelope is invalid or violates local-policy assertions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.schema'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          description: The context envelope has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.schema'
        '423':
          description: Core is sealed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.schema'
  /v1/context/sessions/{sessionId}:
    delete:
      operationId: deleteContextSession
      summary: End a context session and discard all ephemeral evidence.
      security:
        - deviceToken: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The context session was removed or had already expired.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          description: Core is sealed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.schema'
  /v1/chat/stream:
    post:
      operationId: streamChat
      summary: Stream one text interaction as newline-delimited protocol events.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chat-request.schema'
      responses:
        '200':
          description: Newline-delimited ChatStreamEvent values.
          content:
            application/x-ndjson:
              schema:
                type: string
              x-ndjson-schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                $id: https://violet.local/schemas/v1/chat-stream-event.schema.json
                title: ChatStreamEvent
                oneOf:
                  - type: object
                    additionalProperties: false
                    required:
                      - eventId
                      - requestId
                      - type
                    properties:
                      eventId:
                        type: string
                        format: uuid
                      requestId:
                        type: string
                        format: uuid
                      type:
                        const: start
                  - type: object
                    additionalProperties: false
                    required:
                      - content
                      - eventId
                      - requestId
                      - type
                    properties:
                      content:
                        type: string
                        minLength: 1
                      eventId:
                        type: string
                        format: uuid
                      requestId:
                        type: string
                        format: uuid
                      type:
                        const: delta
                  - type: object
                    additionalProperties: false
                    required:
                      - eventId
                      - messageId
                      - requestId
                      - type
                      - usage
                    properties:
                      eventId:
                        type: string
                        format: uuid
                      messageId:
                        type: string
                        format: uuid
                      requestId:
                        type: string
                        format: uuid
                      type:
                        const: complete
                      usage:
                        type: object
                        additionalProperties: false
                        required:
                          - inputTokens
                          - outputTokens
                        properties:
                          inputTokens:
                            type: integer
                            minimum: 0
                          outputTokens:
                            type: integer
                            minimum: 0
                  - type: object
                    additionalProperties: false
                    required:
                      - error
                      - eventId
                      - requestId
                      - type
                    properties:
                      error:
                        $ref: '#/components/schemas/error.schema'
                      eventId:
                        type: string
                        format: uuid
                      requestId:
                        type: string
                        format: uuid
                      type:
                        const: error
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          description: Core is sealed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.schema'
  /v1/realtime:
    get:
      operationId: connectRealtimeSession
      summary: Upgrade to a provider-neutral bidirectional realtime session.
      security:
        - deviceToken: []
      responses:
        '101':
          description: WebSocket protocol upgrade accepted.
          x-websocket-client-event:
            $schema: https://json-schema.org/draft/2020-12/schema
            $id: https://violet.local/schemas/v1/realtime-client-event.schema.json
            title: RealtimeClientEvent
            oneOf:
              - type: object
                additionalProperties: false
                required:
                  - configuration
                  - eventId
                  - sequence
                  - sessionId
                  - type
                properties:
                  configuration:
                    type: object
                    additionalProperties: false
                    required:
                      - inputModalities
                      - outputModalities
                      - protocolVersion
                    properties:
                      contextSessionId:
                        $ref: '#/components/schemas/uuid'
                      inputAudio:
                        $ref: '#/components/schemas/audioFormat'
                      inputModalities:
                        $ref: '#/components/schemas/modalities'
                      language:
                        type: string
                        minLength: 2
                        maxLength: 35
                      onDemandContext:
                        type: boolean
                      outputAudio:
                        $ref: '#/components/schemas/audioFormat'
                      outputModalities:
                        $ref: '#/components/schemas/modalities'
                      protocolVersion:
                        const: '1'
                      turnDetection:
                        type: string
                        enum:
                          - manual
                          - server_vad
                          - smart_turn
                      voice:
                        type: string
                        minLength: 1
                        maxLength: 128
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: session.configure
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - sequence
                  - sessionId
                  - text
                  - turnId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  text:
                    type: string
                    minLength: 1
                    maxLength: 65536
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: input.text
              - type: object
                additionalProperties: false
                required:
                  - audio
                  - eventId
                  - sequence
                  - sessionId
                  - turnId
                  - type
                properties:
                  audio:
                    type: string
                    minLength: 4
                    maxLength: 131072
                    pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: input.audio
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - sequence
                  - sessionId
                  - turnId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: input.commit
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - responseId
                  - sequence
                  - sessionId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  responseId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: response.cancel
              - type: object
                additionalProperties: false
                required:
                  - context
                  - eventId
                  - requestId
                  - sequence
                  - sessionId
                  - turnId
                  - type
                properties:
                  context:
                    $ref: '#/components/schemas/context-envelope.schema'
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  requestId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: context.capture.succeeded
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - reason
                  - requestId
                  - sequence
                  - sessionId
                  - turnId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  reason:
                    type: string
                    enum:
                      - blocked
                      - cancelled
                      - permission_denied
                      - unavailable
                  requestId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: context.capture.failed
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - sequence
                  - sessionId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: session.close
            $defs:
              audioFormat:
                type: object
                additionalProperties: false
                required:
                  - channels
                  - encoding
                  - sampleRate
                properties:
                  channels:
                    const: 1
                  encoding:
                    const: pcm_s16le
                  sampleRate:
                    type: integer
                    enum:
                      - 16000
                      - 24000
                      - 48000
              modalities:
                type: array
                minItems: 1
                maxItems: 2
                uniqueItems: true
                items:
                  type: string
                  enum:
                    - audio
                    - text
              sequence:
                type: integer
                minimum: 1
              uuid:
                type: string
                format: uuid
          x-websocket-server-event:
            $schema: https://json-schema.org/draft/2020-12/schema
            $id: https://violet.local/schemas/v1/realtime-server-event.schema.json
            title: RealtimeServerEvent
            oneOf:
              - type: object
                additionalProperties: false
                required:
                  - capabilities
                  - eventId
                  - sequence
                  - sessionId
                  - type
                properties:
                  capabilities:
                    type: object
                    additionalProperties: false
                    required:
                      - inputModalities
                      - interruption
                      - outputModalities
                      - runtimeKind
                      - transcription
                      - turnDetection
                      - voiceKind
                    properties:
                      inputAudio:
                        $ref: '#/components/schemas/audioFormat'
                      inputModalities:
                        $ref: '#/components/schemas/modalities'
                      interruption:
                        type: boolean
                      outputAudio:
                        $ref: '#/components/schemas/audioFormat'
                      outputModalities:
                        $ref: '#/components/schemas/modalities'
                      runtimeKind:
                        type: string
                        enum:
                          - deterministic
                          - integrated
                          - pipeline
                      transcription:
                        type: boolean
                      turnDetection:
                        type: string
                        enum:
                          - manual
                          - server_vad
                          - smart_turn
                      voiceKind:
                        type: string
                        enum:
                          - clone
                          - none
                          - parametric
                          - preset
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: session.ready
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - sequence
                  - sessionId
                  - turnId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: input.speech.started
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - sequence
                  - sessionId
                  - turnId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: input.speech.stopped
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - final
                  - sequence
                  - sessionId
                  - text
                  - turnId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  final:
                    type: boolean
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  text:
                    type: string
                    minLength: 1
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: input.transcript
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - responseId
                  - sequence
                  - sessionId
                  - turnId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  responseId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: response.started
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - responseId
                  - sequence
                  - sessionId
                  - text
                  - turnId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  responseId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  text:
                    type: string
                    minLength: 1
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: response.text
              - type: object
                additionalProperties: false
                required:
                  - audio
                  - eventId
                  - responseId
                  - sequence
                  - sessionId
                  - turnId
                  - type
                properties:
                  audio:
                    type: string
                    minLength: 4
                    maxLength: 131072
                    pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  responseId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: response.audio
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - responseId
                  - sequence
                  - sessionId
                  - turnId
                  - type
                  - usage
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  responseId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: response.completed
                  usage:
                    $ref: '#/components/schemas/usage'
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - responseId
                  - sequence
                  - sessionId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  responseId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: response.cancelled
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - reason
                  - sequence
                  - sessionId
                  - turnId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  reason:
                    const: user_intent
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: session.end_requested
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - expiresAt
                  - requestId
                  - sequence
                  - sessionId
                  - turnId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  expiresAt:
                    type: string
                    format: date-time
                  requestId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: context.capture.requested
              - type: object
                additionalProperties: false
                required:
                  - code
                  - eventId
                  - message
                  - retryable
                  - sequence
                  - sessionId
                  - type
                properties:
                  code:
                    type: string
                    pattern: ^[A-Z][A-Z0-9_]+$
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  message:
                    type: string
                    minLength: 1
                  retryable:
                    type: boolean
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: error
            $defs:
              audioFormat:
                type: object
                additionalProperties: false
                required:
                  - channels
                  - encoding
                  - sampleRate
                properties:
                  channels:
                    const: 1
                  encoding:
                    const: pcm_s16le
                  sampleRate:
                    type: integer
                    enum:
                      - 16000
                      - 24000
                      - 48000
              modalities:
                type: array
                minItems: 1
                maxItems: 2
                uniqueItems: true
                items:
                  type: string
                  enum:
                    - audio
                    - text
              sequence:
                type: integer
                minimum: 1
              usage:
                type: object
                additionalProperties: false
                required:
                  - inputTokens
                  - outputTokens
                properties:
                  inputTokens:
                    type: integer
                    minimum: 0
                  outputTokens:
                    type: integer
                    minimum: 0
              uuid:
                type: string
                format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          description: Core is sealed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.schema'
components:
  schemas:
    ChatStreamEvent:
      $ref: '#/components/schemas/chat-stream-event.schema'
    ContextEnvelope:
      $ref: '#/components/schemas/context-envelope.schema'
    ContextReceipt:
      $ref: '#/components/schemas/context-receipt.schema'
    RealtimeClientEvent:
      $ref: '#/components/schemas/realtime-client-event.schema'
    RealtimeServerEvent:
      $ref: '#/components/schemas/realtime-server-event.schema'
    health.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://violet.local/schemas/v1/health.schema.json
      title: Health
      type: object
      additionalProperties: false
      required:
        - service
        - status
        - time
        - version
      properties:
        service:
          const: violet-core
        status:
          const: ok
        time:
          type: string
          format: date-time
        version:
          type: string
          minLength: 1
    status.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://violet.local/schemas/v1/status.schema.json
      title: CoreStatus
      type: object
      additionalProperties: false
      required:
        - service
        - state
        - time
        - version
      properties:
        service:
          const: violet-core
        state:
          type: string
          enum:
            - sealed
            - ready
        reason:
          type: string
          minLength: 1
        time:
          type: string
          format: date-time
        version:
          type: string
          minLength: 1
    error.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://violet.local/schemas/v1/error.schema.json
      title: ApiError
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
        - retryable
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]+$
        message:
          type: string
          minLength: 1
        requestId:
          type: string
          format: uuid
        retryable:
          type: boolean
    probability:
      type: number
      minimum: 0
      maximum: 1
    uuid:
      type: string
      format: uuid
    bundleId:
      type: string
      minLength: 3
      maxLength: 255
      pattern: ^[A-Za-z0-9][A-Za-z0-9.-]+$
    normalizedPoint:
      type: object
      additionalProperties: false
      required:
        - x
        - 'y'
      properties:
        x:
          $ref: '#/components/schemas/probability'
        'y':
          $ref: '#/components/schemas/probability'
    image:
      type: object
      additionalProperties: false
      required:
        - data
        - height
        - mediaType
        - sha256
        - width
      properties:
        data:
          type: string
          minLength: 4
          maxLength: 11184812
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
        height:
          type: integer
          minimum: 1
          maximum: 8192
        mediaType:
          type: string
          enum:
            - image/jpeg
            - image/png
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        width:
          type: integer
          minimum: 1
          maximum: 8192
    normalizedRect:
      type: object
      additionalProperties: false
      required:
        - height
        - width
        - x
        - 'y'
      properties:
        height:
          $ref: '#/components/schemas/probability'
        width:
          $ref: '#/components/schemas/probability'
        x:
          $ref: '#/components/schemas/probability'
        'y':
          $ref: '#/components/schemas/probability'
    context-envelope.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://violet.local/schemas/v1/context-envelope.schema.json
      title: ContextEnvelope
      type: object
      additionalProperties: false
      required:
        - authorization
        - capturedAt
        - completeness
        - confidence
        - eventId
        - expiresAt
        - payload
        - protocolVersion
        - redactions
        - sensitivity
        - sequence
        - sessionId
        - source
      properties:
        authorization:
          type: object
          additionalProperties: false
          required:
            - controlledSensitiveAllowed
            - grantId
            - mode
            - purpose
            - retention
          properties:
            controlledSensitiveAllowed:
              type: boolean
            grantId:
              $ref: '#/components/schemas/uuid'
            mode:
              const: explicit
            purpose:
              const: conversation
            retention:
              const: ephemeral
        capturedAt:
          type: string
          format: date-time
        completeness:
          $ref: '#/components/schemas/probability'
        confidence:
          $ref: '#/components/schemas/probability'
        eventId:
          $ref: '#/components/schemas/uuid'
        expiresAt:
          type: string
          format: date-time
        payload:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - text
                - type
              properties:
                text:
                  type: string
