openapi: 3.1.1
info:
  title: Violet Core API
  version: 0.1.0
  description: Versioned control-plane API for the single-user Violet instance.
servers:
  - url: http://127.0.0.1:4310
paths:
  /v1/memory-settings:
    get:
      operationId: getMemorySettings
      summary: Read automatic learning state and the current memory revision.
      security:
        - deviceToken: []
      responses:
        '200':
          description: Authoritative settings; contains no memory content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: updateMemorySettings
      summary: Change automatic learning with version and request identity checks.
      description: Disabling invalidates queued and running tasks. Enabling does not backfill history. A replay returns current settings without undoing newer changes.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/settingsUpdate'
      responses:
        '200':
          description: Current authoritative settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/MemoryConflict'
  /v1/memories:
    get:
      operationId: listMemories
      summary: List current memories with sensitive content masked.
      security:
        - deviceToken: []
      responses:
        '200':
          description: Current memory snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/memories/{memoryId}:
    get:
      operationId: getMemory
      summary: Read memory versions and source turns.
      security:
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/MemoryId'
        - in: query
          name: reveal
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Versions and source turns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/detail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MemoryNotFound'
  /v1/memories/{memoryId}/corrections:
    post:
      operationId: correctMemory
      summary: Append an explicit correction and invalidate the prior version.
      security:
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/MemoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/correction'
      responses:
        '200':
          description: Committed memory changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mutation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/MemoryConflict'
  /v1/memory-deletions/previews:
    post:
      operationId: previewMemoryDeletion
      summary: Preview all affected source turns and memories without deleting them.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/previewRequest'
      responses:
        '200':
          description: Version-bound impact preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/preview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/MemoryConflict'
  /v1/memory-deletions/{deletionId}/preview:
    get:
      operationId: getMemoryDeletionPreview
      summary: Read a deletion preview proposed during conversation.
      security:
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/DeletionId'
      responses:
        '200':
          description: Version-bound impact preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/preview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MemoryNotFound'
  /v1/memory-deletions/{deletionId}/confirm:
    post:
      operationId: confirmMemoryDeletion
      summary: Confirm a preview after the Mac durably advances its minimum restore epoch.
      security:
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/DeletionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/confirmation'
      responses:
        '200':
          description: Online deletion committed; backup cleanup status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deletionStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/MemoryConflict'
  /v1/memory-deletions/{deletionId}:
    get:
      operationId: getMemoryDeletionStatus
      summary: Read backup cleanup status without exposing deleted content.
      security:
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/DeletionId'
      responses:
        '200':
          description: Current deletion and cleanup status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deletionStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MemoryNotFound'
  /v1/memory-deletions/{deletionId}/retry:
    post:
      operationId: retryMemoryBackupCleanup
      summary: Retry failed backup cleanup without undoing online deletion.
      security:
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/DeletionId'
      responses:
        '200':
          description: Current cleanup status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deletionStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MemoryNotFound'
  /v1/health/live:
    get:
      operationId: getLiveHealth
      summary: Report process liveness without reading personal content.
      responses:
        '200':
          description: Core process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/health.schema'
  /v1/status:
    get:
      operationId: getCoreStatus
      summary: Report whether Core is sealed or ready.
      security:
        - deviceToken: []
      responses:
        '200':
          description: Current Core status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/status.schema'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/context/envelopes:
    post:
      operationId: submitContextEnvelope
      summary: Validate and resolve one explicitly authorized context envelope.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/context-envelope.schema'
      responses:
        '200':
          description: The context is available to the active conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/context-receipt.schema'
        '400':
          description: The context envelope is invalid or violates local-policy assertions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.schema'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          description: The context envelope has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.schema'
        '423':
          description: Core is sealed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.schema'
  /v1/context/sessions/{sessionId}:
    delete:
      operationId: deleteContextSession
      summary: End a context session and discard all ephemeral evidence.
      security:
        - deviceToken: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The context session was removed or had already expired.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          description: Core is sealed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.schema'
  /v1/chat/stream:
    post:
      operationId: streamChat
      summary: Stream one text interaction as newline-delimited protocol events.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chat-request.schema'
      responses:
        '200':
          description: Newline-delimited ChatStreamEvent values.
          content:
            application/x-ndjson:
              schema:
                type: string
              x-ndjson-schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                $id: https://violet.local/schemas/v1/chat-stream-event.schema.json
                title: ChatStreamEvent
                oneOf:
                  - type: object
                    additionalProperties: false
                    required:
                      - eventId
                      - requestId
                      - type
                    properties:
                      eventId:
                        type: string
                        format: uuid
                      requestId:
                        type: string
                        format: uuid
                      type:
                        const: start
                  - type: object
                    additionalProperties: false
                    required:
                      - content
                      - eventId
                      - requestId
                      - type
                    properties:
                      content:
                        type: string
                        minLength: 1
                      eventId:
                        type: string
                        format: uuid
                      requestId:
                        type: string
                        format: uuid
                      type:
                        const: delta
                  - type: object
                    additionalProperties: false
                    required:
                      - eventId
                      - messageId
                      - requestId
                      - type
                      - usage
                    properties:
                      eventId:
                        type: string
                        format: uuid
                      messageId:
                        type: string
                        format: uuid
                      requestId:
                        type: string
                        format: uuid
                      type:
                        const: complete
                      memoryChanges:
                        type: array
                        items:
                          $ref: '#/components/schemas/change'
                      memoryDeletionPreviewId:
                        type: string
                        format: uuid
                      usage:
                        type: object
                        additionalProperties: false
                        required:
                          - inputTokens
                          - outputTokens
                        properties:
                          inputTokens:
                            type: integer
                            minimum: 0
                          outputTokens:
                            type: integer
                            minimum: 0
                  - type: object
                    additionalProperties: false
                    required:
                      - error
                      - eventId
                      - requestId
                      - type
                    properties:
                      error:
                        $ref: '#/components/schemas/error.schema'
                      eventId:
                        type: string
                        format: uuid
                      requestId:
                        type: string
                        format: uuid
                      type:
                        const: error
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          description: Core is sealed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.schema'
  /v1/realtime:
    get:
      operationId: connectRealtimeSession
      summary: Upgrade to a provider-neutral bidirectional realtime session.
      security:
        - deviceToken: []
      responses:
        '101':
          description: WebSocket protocol upgrade accepted.
          x-websocket-client-event:
            $schema: https://json-schema.org/draft/2020-12/schema
            $id: https://violet.local/schemas/v1/realtime-client-event.schema.json
            title: RealtimeClientEvent
            oneOf:
              - type: object
                additionalProperties: false
                required:
                  - configuration
                  - eventId
                  - sequence
                  - sessionId
                  - type
                properties:
                  configuration:
                    type: object
                    additionalProperties: false
                    required:
                      - inputModalities
                      - outputModalities
                      - protocolVersion
                    properties:
                      contextSessionId:
                        $ref: '#/components/schemas/uuid'
                      inputAudio:
                        $ref: '#/components/schemas/audioFormat'
                      inputModalities:
                        $ref: '#/components/schemas/modalities'
                      language:
                        type: string
                        minLength: 2
                        maxLength: 35
                      onDemandContext:
                        type: boolean
                      outputAudio:
                        $ref: '#/components/schemas/audioFormat'
                      outputModalities:
                        $ref: '#/components/schemas/modalities'
                      protocolVersion:
                        const: '1'
                      turnDetection:
                        type: string
                        enum:
                          - manual
                          - server_vad
                          - smart_turn
                      voice:
                        type: string
                        minLength: 1
                        maxLength: 128
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: session.configure
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - sequence
                  - sessionId
                  - text
                  - turnId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  text:
                    type: string
                    minLength: 1
                    maxLength: 65536
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: input.text
              - type: object
                additionalProperties: false
                required:
                  - audio
                  - eventId
                  - sequence
                  - sessionId
                  - turnId
                  - type
                properties:
                  audio:
                    type: string
                    minLength: 4
                    maxLength: 131072
                    pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: input.audio
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - sequence
                  - sessionId
                  - turnId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: input.commit
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - responseId
                  - sequence
                  - sessionId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  responseId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: response.cancel
              - type: object
                additionalProperties: false
                required:
                  - context
                  - eventId
                  - requestId
                  - sequence
                  - sessionId
                  - turnId
                  - type
                properties:
                  context:
                    $ref: '#/components/schemas/context-envelope.schema'
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  requestId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: context.capture.succeeded
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - reason
                  - requestId
                  - sequence
                  - sessionId
                  - turnId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  reason:
                    type: string
                    enum:
                      - blocked
                      - cancelled
                      - permission_denied
                      - unavailable
                  requestId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: context.capture.failed
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - sequence
                  - sessionId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: session.close
            $defs:
              audioFormat:
                type: object
                additionalProperties: false
                required:
                  - channels
                  - encoding
                  - sampleRate
                properties:
                  channels:
                    const: 1
                  encoding:
                    const: pcm_s16le
                  sampleRate:
                    type: integer
                    enum:
                      - 16000
                      - 24000
                      - 48000
              modalities:
                type: array
                minItems: 1
                maxItems: 2
                uniqueItems: true
                items:
                  type: string
                  enum:
                    - audio
                    - text
              sequence:
                type: integer
                minimum: 1
              uuid:
                type: string
                format: uuid
          x-websocket-server-event:
            $schema: https://json-schema.org/draft/2020-12/schema
            $id: https://violet.local/schemas/v1/realtime-server-event.schema.json
            title: RealtimeServerEvent
            oneOf:
              - type: object
                additionalProperties: false
                required:
                  - capabilities
                  - eventId
                  - sequence
                  - sessionId
                  - type
                properties:
                  capabilities:
                    type: object
                    additionalProperties: false
                    required:
                      - inputModalities
                      - interruption
                      - outputModalities
                      - runtimeKind
                      - transcription
                      - turnDetection
                      - voiceKind
                    properties:
                      inputAudio:
                        $ref: '#/components/schemas/audioFormat'
                      inputModalities:
                        $ref: '#/components/schemas/modalities'
                      interruption:
                        type: boolean
                      outputAudio:
                        $ref: '#/components/schemas/audioFormat'
                      outputModalities:
                        $ref: '#/components/schemas/modalities'
                      runtimeKind:
                        type: string
                        enum:
                          - deterministic
                          - integrated
                          - pipeline
                      transcription:
                        type: boolean
                      turnDetection:
                        type: string
                        enum:
                          - manual
                          - server_vad
                          - smart_turn
                      voiceKind:
                        type: string
                        enum:
                          - clone
                          - none
                          - parametric
                          - preset
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: session.ready
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - sequence
                  - sessionId
                  - turnId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: input.speech.started
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - sequence
                  - sessionId
                  - turnId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: input.speech.stopped
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - final
                  - sequence
                  - sessionId
                  - text
                  - turnId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  final:
                    type: boolean
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  text:
                    type: string
                    minLength: 1
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: input.transcript
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - responseId
                  - sequence
                  - sessionId
                  - turnId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  responseId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: response.started
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - responseId
                  - sequence
                  - sessionId
                  - text
                  - turnId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  responseId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  text:
                    type: string
                    minLength: 1
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: response.text
              - type: object
                additionalProperties: false
                required:
                  - audio
                  - eventId
                  - responseId
                  - sequence
                  - sessionId
                  - turnId
                  - type
                properties:
                  audio:
                    type: string
                    minLength: 4
                    maxLength: 131072
                    pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  responseId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: response.audio
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - responseId
                  - sequence
                  - sessionId
                  - turnId
                  - type
                  - usage
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  responseId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: response.completed
                  memoryChanges:
                    type: array
                    items:
                      $ref: '#/components/schemas/change'
                  memoryDeletionPreviewId:
                    type: string
                    format: uuid
                  usage:
                    $ref: '#/components/schemas/usage'
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - responseId
                  - sequence
                  - sessionId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  responseId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: response.cancelled
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - reason
                  - sequence
                  - sessionId
                  - turnId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  reason:
                    enum:
                      - user_intent
                      - memory_changed
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: session.end_requested
              - type: object
                additionalProperties: false
                required:
                  - eventId
                  - expiresAt
                  - requestId
                  - sequence
                  - sessionId
                  - turnId
                  - type
                properties:
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  expiresAt:
                    type: string
                    format: date-time
                  requestId:
                    $ref: '#/components/schemas/uuid'
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  turnId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: context.capture.requested
              - type: object
                additionalProperties: false
                required:
                  - code
                  - eventId
                  - message
                  - retryable
                  - sequence
                  - sessionId
                  - type
                properties:
                  code:
                    type: string
                    pattern: ^[A-Z][A-Z0-9_]+$
                  eventId:
                    $ref: '#/components/schemas/uuid'
                  message:
                    type: string
                    minLength: 1
                  retryable:
                    type: boolean
                  sequence:
                    $ref: '#/components/schemas/sequence'
                  sessionId:
                    $ref: '#/components/schemas/uuid'
                  type:
                    const: error
            $defs:
              audioFormat:
                type: object
                additionalProperties: false
                required:
                  - channels
                  - encoding
                  - sampleRate
                properties:
                  channels:
                    const: 1
                  encoding:
                    const: pcm_s16le
                  sampleRate:
                    type: integer
                    enum:
                      - 16000
                      - 24000
                      - 48000
              modalities:
                type: array
                minItems: 1
                maxItems: 2
                uniqueItems: true
                items:
                  type: string
                  enum:
                    - audio
                    - text
              sequence:
                type: integer
                minimum: 1
              usage:
                type: object
                additionalProperties: false
                required:
                  - inputTokens
                  - outputTokens
                properties:
                  inputTokens:
                    type: integer
                    minimum: 0
                  outputTokens:
                    type: integer
                    minimum: 0
              uuid:
                type: string
                format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          description: Core is sealed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.schema'
