        image:
          type: object
          additionalProperties: false
          required:
            - data
            - height
            - mediaType
            - sha256
            - width
          properties:
            data:
              type: string
              minLength: 4
              maxLength: 11184812
              pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
            height:
              type: integer
              minimum: 1
              maximum: 8192
            mediaType:
              type: string
              enum:
                - image/jpeg
                - image/png
            sha256:
              type: string
              pattern: ^[a-f0-9]{64}$
            width:
              type: integer
              minimum: 1
              maximum: 8192
        normalizedRect:
          type: object
          additionalProperties: false
          required:
            - height
            - width
            - x
            - 'y'
          properties:
            height:
              $ref: '#/components/schemas/probability'
            width:
              $ref: '#/components/schemas/probability'
            x:
              $ref: '#/components/schemas/probability'
            'y':
              $ref: '#/components/schemas/probability'
        normalizedPoint:
          type: object
          additionalProperties: false
          required:
            - x
            - 'y'
          properties:
            x:
              $ref: '#/components/schemas/probability'
            'y':
              $ref: '#/components/schemas/probability'
        probability:
          type: number
          minimum: 0
          maximum: 1
        uuid:
          type: string
          format: uuid
